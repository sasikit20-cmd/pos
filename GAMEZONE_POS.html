<!doctype html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GAMEZONE POS</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Thai",sans-serif;background:#f4f6fb;color:#172033}button,input,select{font:inherit}.app{display:flex;min-height:100vh}.side{width:230px;background:#10152b;color:#fff;padding:22px 15px;position:fixed;inset:0 auto 0 0}.brand{font-size:22px;font-weight:800;padding:8px 10px 25px}.brand span{color:#8b5cf6}.menu button{width:100%;border:0;background:transparent;color:#b9c0d4;text-align:left;padding:13px 12px;border-radius:10px;cursor:pointer;margin:3px 0}.menu button.active,.menu button:hover{background:#252b49;color:#fff}.main{margin-left:230px;width:calc(100% - 230px);padding:25px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.top h1{margin:0;font-size:27px}.date{color:#778199}.grid{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:20px}.panel,.stat{background:#fff;border:1px solid #e3e7f0;border-radius:16px;padding:18px;box-shadow:0 5px 18px #15203a0b}.toolbar{display:flex;gap:10px;margin-bottom:15px}.search{flex:1;border:1px solid #d9deea;border-radius:10px;padding:11px 13px}.cats{display:flex;gap:8px;overflow:auto;margin-bottom:15px}.cat{white-space:nowrap;border:1px solid #dbe0eb;background:#fff;padding:8px 13px;border-radius:20px;cursor:pointer}.cat.active{background:#6d3df5;color:#fff;border-color:#6d3df5}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.product{border:1px solid #e1e5ef;border-radius:13px;padding:14px;cursor:pointer;background:#fff}.product:hover{transform:translateY(-2px);border-color:#8b5cf6}.emoji{font-size:38px;background:#f2f0ff;border-radius:10px;text-align:center;padding:12px;margin-bottom:10px}.product h3{font-size:15px;margin:0 0 4px}.product small{color:#7b8498}.price{font-size:18px;font-weight:800;margin-top:8px}.stock{color:#8a94a8;font-size:12px}.cart-title{display:flex;justify-content:space-between;align-items:center}.clear,.danger{border:0;background:#fee2e2;color:#b91c1c;border-radius:8px;padding:7px 10px;cursor:pointer}.cart-items{min-height:280px;max-height:400px;overflow:auto;margin:12px 0}.item{border-bottom:1px solid #edf0f5;padding:11px 0}.item-row{display:flex;justify-content:space-between;gap:10px}.qty{display:flex;align-items:center;gap:7px;margin-top:8px}.qty button{width:27px;height:27px;border:1px solid #d8ddea;background:#fff;border-radius:6px;cursor:pointer}.total{border-top:1px solid #e5e8ef;padding-top:14px}.line{display:flex;justify-content:space-between;margin:8px 0;color:#667087}.grand{font-size:24px;font-weight:900;color:#171d30}.checkout,.primary{border:0;background:#6d3df5;color:#fff;padding:13px;border-radius:11px;font-weight:800;cursor:pointer}.checkout{width:100%;margin-top:12px}.page{display:none}.page.active{display:block}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.stat small{color:#788197}.stat b{display:block;font-size:25px;margin-top:8px}.table{width:100%;border-collapse:collapse;background:#fff}.table th,.table td{padding:12px;text-align:left;border-bottom:1px solid #edf0f5}.empty{text-align:center;color:#8a94a8;padding:35px}.modal{display:none;position:fixed;inset:0;background:#11182799;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.show{display:flex}.modal-box{background:#fff;width:min(460px,100%);border-radius:17px;padding:22px}.modal-box h2{margin-top:0}.modal-box input,.modal-box select{width:100%;padding:11px;border:1px solid #d8deea;border-radius:9px;margin:7px 0 12px}.close{float:right;border:0;background:none;font-size:24px;cursor:pointer}
@media(max-width:1000px){.products{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.side{width:65px;padding:15px 8px}.brand{font-size:0}.menu button{font-size:0;text-align:center}.main{margin-left:65px;width:calc(100% - 65px);padding:15px}.products{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}}
</style></head><body><div class="app">
<aside class="side"><div class="brand">🎮 GAMEZONE <span>POS</span></div><div class="menu">
<button class="active" onclick="showPage('sell',this)">🛒 หน้าขาย</button><button onclick="showPage('dashboard',this)">📊 Dashboard</button><button onclick="showPage('history',this)">🧾 ประวัติการขาย</button><button onclick="showPage('products',this)">📦 สินค้า</button>
</div></aside>
<main class="main">
<section id="sell" class="page active"><div class="top"><div><h1>ระบบขายสินค้า POS</h1><div class="date" id="today"></div></div><button class="primary" onclick="openCheckout()">ชำระเงิน</button></div>
<div class="grid"><div class="panel"><div class="toolbar"><input id="search" class="search" placeholder="🔎 ค้นหาสินค้า..." oninput="renderProducts()"></div><div class="cats" id="cats"></div><div class="products" id="productsGrid"></div></div>
<div class="panel"><div class="cart-title"><h2>🛒 ตะกร้า</h2><button class="clear" onclick="clearCart()">ล้าง</button></div><div id="cartItems" class="cart-items"></div><div class="total"><div class="line"><span>จำนวนสินค้า</span><b id="qtyTotal">0</b></div><div class="line"><span>ส่วนลด</span><b>฿0</b></div><div class="line grand"><span>รวม</span><span id="grandTotal">฿0</span></div><button class="checkout" onclick="openCheckout()">ชำระเงิน</button></div></div></div></section>
<section id="dashboard" class="page"><div class="top"><h1>📊 Dashboard</h1></div><div class="stats"><div class="stat"><small>ยอดขายวันนี้</small><b id="dSales">฿0</b></div><div class="stat"><small>ออเดอร์วันนี้</small><b id="dOrders">0</b></div><div class="stat"><small>สินค้าที่ขาย</small><b id="dItems">0</b></div><div class="stat"><small>จำนวนสินค้า</small><b id="dProducts">0</b></div></div><div class="panel" style="margin-top:18px"><h2>สินค้าขายดี</h2><div id="best"></div></div></section>
<section id="history" class="page"><div class="top"><h1>🧾 ประวัติการขาย</h1><button class="danger" onclick="clearHistory()">ล้างประวัติ</button></div><div class="panel"><table class="table"><thead><tr><th>เลขที่</th><th>เวลา</th><th>สินค้า</th><th>ชำระเงิน</th><th>ยอดรวม</th></tr></thead><tbody id="historyBody"></tbody></table></div></section>
<section id="products" class="page"><div class="top"><h1>📦 สินค้า</h1></div><div class="panel"><table class="table"><thead><tr><th>สินค้า</th><th>หมวด</th><th>ราคา</th><th>สต็อก</th></tr></thead><tbody id="productBody"></tbody></table></div></section>
</main></div>
<div class="modal" id="checkoutModal"><div class="modal-box"><button class="close" onclick="closeCheckout()">×</button><h2>💳 ชำระเงิน</h2><div id="checkoutSummary"></div><label>ชื่อลูกค้า / Game ID</label><input id="customer" placeholder="เช่น Player123"><label>ช่องทางชำระเงิน</label><select id="payment"><option>PromptPay</option><option>TrueMoney Wallet</option><option>โอนธนาคาร</option><option>เงินสด</option></select><button class="checkout" onclick="completeSale()">ยืนยันการขาย</button></div></div>
<script>
const products=[{id:1,name:"1,000 Gems",cat:"Currency",price:99,stock:50,icon:"💎"},{id:2,name:"Legendary Sword",cat:"Weapon",price:199,stock:12,icon:"⚔️"},{id:3,name:"Mystery Box",cat:"Item",price:59,stock:30,icon:"🎁"},{id:4,name:"VIP Package",cat:"Premium",price:299,stock:20,icon:"👑"},{id:5,name:"Gold 10M",cat:"Currency",price:149,stock:40,icon:"🪙"},{id:6,name:"Dragon Armor",cat:"Armor",price:249,stock:8,icon:"🛡️"}];
let cart=[],category="ทั้งหมด",sales=JSON.parse(localStorage.getItem("gamezone_sales")||"[]");
const money=n=>"฿"+n.toLocaleString("th-TH");
document.getElementById("today").textContent=new Date().toLocaleString("th-TH",{dateStyle:"full",timeStyle:"short"});
function showPage(id,btn){document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");document.querySelectorAll(".menu button").forEach(x=>x.classList.remove("active"));btn.classList.add("active");if(id==="dashboard")renderDashboard();if(id==="history")renderHistory();if(id==="products")renderProductTable()}
function renderCats(){let cats=["ทั้งหมด",...new Set(products.map(p=>p.cat))];document.getElementById("cats").innerHTML=cats.map(c=>`<button class="cat ${c===category?"active":""}" onclick="category='${c}';renderCats();renderProducts()">${c}</button>`).join("")}
function renderProducts(){let q=document.getElementById("search").value.toLowerCase();let list=products.filter(p=>(category==="ทั้งหมด"||p.cat===category)&&p.name.toLowerCase().includes(q));document.getElementById("productsGrid").innerHTML=list.map(p=>`<div class="product" onclick="addCart(${p.id})"><div class="emoji">${p.icon}</div><h3>${p.name}</h3><small>${p.cat} • <span class="stock">เหลือ ${p.stock}</span></small><div class="price">${money(p.price)}</div></div>`).join("")||'<div class="empty">ไม่พบสินค้า</div>'}
function addCart(id){let p=products.find(x=>x.id===id),item=cart.find(x=>x.id===id);if(item){if(item.qty<p.stock)item.qty++;else return alert("สินค้าไม่พอในสต็อก")}else cart.push({...p,qty:1});renderCart()}
function changeQty(id,d){let x=cart.find(i=>i.id===id);if(!x)return;x.qty+=d;if(x.qty<=0)cart=cart.filter(i=>i.id!==id);else if(x.qty>x.stock)x.qty=x.stock;renderCart()}
function clearCart(){cart=[];renderCart()}
function renderCart(){let el=document.getElementById("cartItems");if(!cart.length)el.innerHTML='<div class="empty">ยังไม่มีสินค้า<br>กดสินค้าด้านซ้ายเพื่อเพิ่ม</div>';else el.innerHTML=cart.map(x=>`<div class="item"><div class="item-row"><b>${x.icon} ${x.name}</b><b>${money(x.price*x.qty)}</b></div><div class="qty"><button onclick="changeQty(${x.id},-1)">−</button><span>${x.qty}</span><button onclick="changeQty(${x.id},1)">+</button><small>× ${money(x.price)}</small></div></div>`).join("");let qty=cart.reduce((s,x)=>s+x.qty,0),total=cart.reduce((s,x)=>s+x.price*x.qty,0);document.getElementById("qtyTotal").textContent=qty;document.getElementById("grandTotal").textContent=money(total)}
function openCheckout(){if(!cart.length)return alert("กรุณาเลือกสินค้าก่อน");let total=cart.reduce((s,x)=>s+x.price*x.qty,0);document.getElementById("checkoutSummary").innerHTML=cart.map(x=>`<div class="line"><span>${x.name} × ${x.qty}</span><b>${money(x.price*x.qty)}</b></div>`).join("")+`<div class="line grand"><span>ยอดชำระ</span><b>${money(total)}</b></div>`;document.getElementById("checkoutModal").classList.add("show")}
function closeCheckout(){document.getElementById("checkoutModal").classList.remove("show")}
function completeSale(){if(!cart.length)return;let customer=document.getElementById("customer").value.trim()||"ลูกค้าทั่วไป",payment=document.getElementById("payment").value,total=cart.reduce((s,x)=>s+x.price*x.qty,0);let sale={id:"GZ-"+Date.now().toString().slice(-6),time:new Date().toLocaleString("th-TH"),customer,payment,total,items:cart.map(x=>({name:x.name,qty:x.qty,price:x.price}))};sales.unshift(sale);localStorage.setItem("gamezone_sales",JSON.stringify(sales));cart.forEach(x=>{let p=products.find(z=>z.id===x.id);p.stock-=x.qty});alert("บันทึกการขายเรียบร้อย\nเลขที่: "+sale.id+"\nยอดรวม: "+money(total));cart=[];document.getElementById("customer").value="";closeCheckout();renderCart();renderProducts();renderProductTable()}
function renderDashboard(){let today=new Date().toLocaleDateString("th-TH"),todays=sales.filter(s=>s.time.startsWith(today));document.getElementById("dSales").textContent=money(todays.reduce((s,x)=>s+x.total,0));document.getElementById("dOrders").textContent=todays.length;document.getElementById("dItems").textContent=todays.reduce((s,x)=>s+x.items.reduce((a,i)=>a+i.qty,0),0);document.getElementById("dProducts").textContent=products.length;let map={};sales.forEach(s=>s.items.forEach(i=>map[i.name]=(map[i.name]||0)+i.qty));let best=Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,5);document.getElementById("best").innerHTML=best.length?best.map((x,i)=>`<div class="line"><span>${i+1}. ${x[0]}</span><b>${x[1]} ชิ้น</b></div>`).join(""):"<div class='empty'>ยังไม่มีข้อมูลการขาย</div>"}
function renderHistory(){document.getElementById("historyBody").innerHTML=sales.length?sales.map(s=>`<tr><td>${s.id}</td><td>${s.time}</td><td>${s.items.map(i=>i.name+" × "+i.qty).join(", ")}</td><td>${s.payment}</td><td><b>${money(s.total)}</b></td></tr>`).join(""):'<tr><td colspan="5" class="empty">ยังไม่มีประวัติการขาย</td></tr>'}
function clearHistory(){if(confirm("ต้องการล้างประวัติการขายทั้งหมดหรือไม่?")){sales=[];localStorage.removeItem("gamezone_sales");renderHistory();renderDashboard()}}
function renderProductTable(){document.getElementById("productBody").innerHTML=products.map(p=>`<tr><td>${p.icon} ${p.name}</td><td>${p.cat}</td><td>${money(p.price)}</td><td>${p.stock}</td></tr>`).join("")}
renderCats();renderProducts();renderCart();renderProductTable();
</script></body></html>
